workflows:
  ios-release:
    name: Freshinbasket iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - t1
      vars:
        BUNDLE_ID: "in.freshinbasket.app"
    scripts:
      # Step 1: Get Flutter packages (this triggers project file upgrades)
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      # Step 2: Install CocoaPods dependencies
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      # Step 3: Set up code signing AFTER flutter has upgraded project files
      - name: Set up code signing
        script: |
          keychain initialize
          # Generate a fresh private key for certificate creation
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key /tmp/cert_key.pem
          keychain add-certificates
          xcode-project use-profiles
      # Step 4: Build using xcode-project (Codemagic CLI) instead of flutter build ipa
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - '**/*.ipa'
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - piyushkumarkumar7431@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

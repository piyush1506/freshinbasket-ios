workflows:
  ios-release:
    name: Freshinbasket iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - t1
      vars:
        BUNDLE_ID: "in.freshinbasket.app"
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          keychain initialize

          # Generate a fresh RSA private key
          openssl genrsa -out /tmp/cert_key.pem 2048

          # Debug: List all existing certificates
          echo "=== Listing existing certificates ==="
          app-store-connect list-certificates --type IOS_DISTRIBUTION || true

          # Create a new distribution certificate explicitly
          echo "=== Creating new distribution certificate ==="
          app-store-connect create-certificate \
            --type IOS_DISTRIBUTION \
            --certificate-key /tmp/cert_key.pem \
            --save || echo "Certificate may already exist, continuing..."

          # Fetch signing files (profiles + certificates)
          echo "=== Fetching signing files ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key /tmp/cert_key.pem

          # Add certificates to keychain
          keychain add-certificates

          # Debug: List what was downloaded
          echo "=== Downloaded certificates ==="
          ls -la ~/Library/MobileDevice/Certificates/ || true
          echo "=== Downloaded profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true

          # Apply profiles to Xcode project
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - '**/*.ipa'
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - piyushkumarkumar7431@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

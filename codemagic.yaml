workflows:
  ios-release:
    name: Freshinbasket iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - t1
      vars:
        BUNDLE_ID: "com.freshinbasket.app"
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          find . -maxdepth 3 -name Podfile -execdir pod install \;
      - name: Set up code signing
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] && [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "✅ Setting up certificates with App Store Connect API Key..."
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles
          else
            echo "⚠️ App Store Connect credentials not found in environment."
          fi
      - name: Build iOS IPA
        script: |
          if [ -f "/Users/builder/export_options.plist" ]; then
            echo "Building signed IPA using export_options.plist..."
            flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
          else
            echo "Building unsigned archive..."
            flutter build ipa --release --no-codesign
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - piyushkumarkumar7431@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

workflows:
  ios-release:
    name: Freshinbasket iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # Configure APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY in Codemagic UI
      vars:
        BUNDLE_ID: "com.freshinbasket.app"
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ]; then
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles
          else
            echo "No App Store API Key found, skipping certificate installation..."
          fi
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          find . -maxdepth 3 -name Podfile -execdir pod install \;
      - name: Flutter build IPA
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ]; then
            flutter build ipa --release
          else
            flutter build ipa --release --no-codesign
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - piyushkumarkumar7431@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
